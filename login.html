<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login</title>
    <link rel= "stylesheet" href="style.css">
    <link rel= "stylesheet" href="responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>
<body>
    
    <div class="account-page">

        <form id="login-form" class="signing-in">
            <h2>Welcome to your one way stop to Lux, Urban-Threads</h2>
            <input type="email" id="user-email" placeholder = "Email Address required">
            <input type="password" id="user-password" placeholder="Account Password required">
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>
</body>
</html>
